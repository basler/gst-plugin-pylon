name: CI for gstreamer
on:
  push:
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:



jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: jfrog/setup-jfrog-cli@v5
      env:
       JF_URL: ${{ secrets.SDK_URL }}
       JF_ACCESS_TOKEN: ${{ secrets.SDK_TOKEN }}
      with:
        disable-auto-build-publish: true
        disable-job-summary: true
 
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Check for release build and tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        echo "Build release for $TAG_NAME"
        echo "RELEASE_BUILD=1" >> $GITHUB_ENV
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

    - name: Authenticate to Artifactory
      run: |
        jf c add --url=$JF_URL --access-token=$JF_ACCESS_TOKEN --interactive=false

    - name: Download control files from Artifactory
      id: get_matrix
      run: |
        set +x
        set -e
        build_config=$(cat .github/workflows/build_config.json)
        pylon_default_version="26.06"
        for os in $(echo $build_config | jq -r 'keys[]'); do
          if [[ $os == "windows" || $os == "macos" ]]; then
            targets=$(echo $build_config | jq -c ".\"$os\".targets")
            echo "${os}_targets=$targets" >> $GITHUB_OUTPUT
            pylon_sdks=$(echo $build_config | jq -c ".\"$os\".pylon_sdks")
            echo "${os}_pylon_sdks=$pylon_sdks" >> $GITHUB_OUTPUT
          elif [[ $os == "linux-x86_64" || $os == "linux-aarch64" ]]; then
            targets=$(echo $build_config | jq -c ".\"$os\".targets")
            echo "${os}_targets=$targets" >> $GITHUB_OUTPUT
            pylon_sdks=$(echo $build_config | jq -c ".\"$os\".pylon_sdks")
            echo "${os}_pylon_sdks=$pylon_sdks" >> $GITHUB_OUTPUT
          fi
          tag=$(echo "${TAG_NAME:-$pylon_default_version}" | sed 's/rc[0-9]*$//')
          if [[ $os == "linux-x86_64" ]]; then
            os_search="linux_x86_64"
          elif [[ $os == "linux-aarch64" ]]; then
            os_search="linux_aarch64"
          elif [[ $os == "windows" ]]; then
            os_search="windows"
          elif [[ $os == "macos" ]]; then
            os_search="macos"
          fi
          echo "Downloading control files for $os_search using pylon $tag"
          latest_build=$(jf rt s "pylon-artifacts-generic-*/setup/*/report_${os_search}*.json" | jq -r --arg tag "$tag" '.[] | select(.path | test($tag)) | .path' | sed -E 's|.*/([0-9]{8}\.[0-9]+)/.*|\1|' | sort -V | tail -1)
          for path in $(jf rt s "pylon-artifacts-generic-*/setup/*/report_${os_search}*.json" | jq -r --arg tag "$tag" --arg build "$latest_build" '.[] | select(.path | test($tag)) | select(.path | test($build)) | .path'); do
            jf rt dl --flat $path ./${os_search}/report_${os_search}.json
          done
          for path in $(jf rt s "pylon-artifacts-generic-*/setup/*/oso_${os_search}*.txt" | jq -r --arg tag "$tag" --arg build "$latest_build" '.[] | select(.path | test($tag)) | select(.path | test($build)) | .path'); do
            jf rt dl --flat $path ./${os_search}/pylon_Third-Party_Licenses.txt
          done
        done

    - name: Upload control files for Linux aarch64
      uses: actions/upload-artifact@v6
      with:
        name: Linux_aarch64_Pylon
        path: linux_aarch64

    - name: Upload control files for Linux x86_64
      uses: actions/upload-artifact@v6
      with:
        name: Linux_x86_64_Pylon
        path: linux_x86_64

    - name: Upload control files for Windows
      uses: actions/upload-artifact@v6
      with:
        name: Windows_Pylon
        path: windows

    - name: Upload control files for macOS
      uses: actions/upload-artifact@v6
      with:
        name: macOS_Pylon
        path: macos

    outputs:
      is_release_build: ${{ env.RELEASE_BUILD == '1' }}
      linux_x86_64_targets: ${{ steps.get_matrix.outputs.linux-x86_64_targets }}
      linux_x86_64_pylon_sdks: ${{ steps.get_matrix.outputs.linux-x86_64_pylon_sdks }}
      linux_aarch64_targets: ${{ steps.get_matrix.outputs.linux-aarch64_targets }}
      linux_aarch64_pylon_sdks: ${{ steps.get_matrix.outputs.linux-aarch64_pylon_sdks }}
      windows_targets: ${{ steps.get_matrix.outputs.windows_targets }}
      windows_pylon_sdks: ${{ steps.get_matrix.outputs.windows_pylon_sdks }}
      macos_targets: ${{ steps.get_matrix.outputs.macos_targets }}
      macos_pylon_sdks: ${{ steps.get_matrix.outputs.macos_pylon_sdks }}

  download_linux_x86_64:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        pylon_sdk: ${{ fromJson(needs.setup.outputs.linux_x86_64_pylon_sdks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install conan v1
        run: pip install "conan<2"

      - name: Add conan v1 remote and authenticate
        env:
          JF_URL: ${{ secrets.SDK_URL }}
          JF_USER: ${{ secrets.SDK_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          import os
          import subprocess

          subprocess.run(["conan", "config", "set", "general.revisions_enabled=1"], check=True)
          subprocess.run([
            "conan", "remote", "add", "pylon-conan-prod",
            f"{os.environ['JF_URL']}/artifactory/api/conan/pylon-conan-prod", "--insert", "0"
          ], check=True)
          subprocess.run([
            "conan", "user", "-p", os.environ["JF_ACCESS_TOKEN"],
            "-r", "pylon-conan-prod", os.environ["JF_USER"]
          ], check=True)
        shell: python

      - name: Download Linux x86_64 control artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Linux_x86_64*Pylon
          merge-multiple: true
          path: pylon-install-files

      - name: Download needed pylon modules
        run: |
          import os
          import subprocess

          subprocess.run([
            "conan", "install", "--update", "--install-folder", "conan",
            "-pr", os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "profiles", "linux_x64"),
            "-o", f"gst-plugin-pylon:control_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'report_linux_x86_64.json')}",
            "-o", f"gst-plugin-pylon:third_party_license_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'pylon_Third-Party_Licenses.txt')}",
            "-c", "tools.system.package_manager:mode=install",
            "-c", "tools.system.package_manager:sudo=True",
            os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "conanfile.py")
          ], check=True)
        shell: python

      - name: Tar pylon SDK files
        run: tar -czf pylon_sdk.tar.gz -C conan pylon

      - name: Upload pylon SDK for Linux x86_64 ${{ matrix.pylon_sdk }}
        uses: actions/upload-artifact@v6
        with:
          name: Linux_x86_64_Pylon_SDK_${{ matrix.pylon_sdk }}
          path: pylon_sdk.tar.gz

  download_linux_aarch64:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        pylon_sdk: ${{ fromJson(needs.setup.outputs.linux_aarch64_pylon_sdks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install conan v1
        run: pip install "conan<2"

      - name: Add conan v1 remote and authenticate
        env:
          JF_URL: ${{ secrets.SDK_URL }}
          JF_USER: ${{ secrets.SDK_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          import os
          import subprocess

          subprocess.run(["conan", "config", "set", "general.revisions_enabled=1"], check=True)
          subprocess.run([
            "conan", "remote", "add", "pylon-conan-prod",
            f"{os.environ['JF_URL']}/artifactory/api/conan/pylon-conan-prod", "--insert", "0"
          ], check=True)
          subprocess.run([
            "conan", "user", "-p", os.environ["JF_ACCESS_TOKEN"],
            "-r", "pylon-conan-prod", os.environ["JF_USER"]
          ], check=True)
        shell: python

      - name: Download Linux aarch64 control artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Linux_aarch64*Pylon
          merge-multiple: true
          path: pylon-install-files

      - name: Download needed pylon modules
        run: |
          import os
          import subprocess

          subprocess.run([
            "conan", "install", "--update", "--install-folder", "conan",
            "-pr", os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "profiles", "linux_arm64"),
            "-o", f"gst-plugin-pylon:control_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'report_linux_aarch64.json')}",
            "-o", f"gst-plugin-pylon:third_party_license_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'pylon_Third-Party_Licenses.txt')}",
            "-c", "tools.system.package_manager:mode=install",
            "-c", "tools.system.package_manager:sudo=True",
            os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "conanfile.py")
          ], check=True)
        shell: python

      - name: Tar pylon SDK files
        run: tar -czf pylon_sdk.tar.gz -C conan pylon

      - name: Upload pylon SDK for Linux aarch64 ${{ matrix.pylon_sdk }}
        uses: actions/upload-artifact@v6
        with:
          name: Linux_aarch64_Pylon_SDK_${{ matrix.pylon_sdk }}
          path: pylon_sdk.tar.gz

  download_windows:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        pylon_sdk: ${{ fromJson(needs.setup.outputs.windows_pylon_sdks) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install conan v1
        run: pip install "conan<2"

      - name: Add conan v1 remote and authenticate
        env:
          JF_URL: ${{ secrets.SDK_URL }}
          JF_USER: ${{ secrets.SDK_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          import os
          import subprocess

          subprocess.run(["conan", "config", "set", "general.revisions_enabled=1"], check=True)
          subprocess.run([
            "conan", "remote", "add", "pylon-conan-prod",
            f"{os.environ['JF_URL']}/artifactory/api/conan/pylon-conan-prod", "--insert", "0"
          ], check=True)
          subprocess.run([
            "conan", "user", "-p", os.environ["JF_ACCESS_TOKEN"],
            "-r", "pylon-conan-prod", os.environ["JF_USER"]
          ], check=True)
        shell: python

      - name: Download Windows control artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Windows*Pylon
          merge-multiple: true
          path: pylon-install-files

      - name: Download needed pylon modules
        run: |
          import os
          import subprocess

          subprocess.run([
            "conan", "install", "--update", "--install-folder", "conan",
            "-pr", os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "profiles", "windows_x64"),
            "-o", f"gst-plugin-pylon:control_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'report_windows.json')}",
            "-o", f"gst-plugin-pylon:third_party_license_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'pylon_Third-Party_Licenses.txt')}",
            "-c", "tools.system.package_manager:mode=install",
            "-c", "tools.system.package_manager:sudo=True",
            os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "conanfile.py")
          ], check=True)
        shell: python

      - name: Upload pylon SDK for Windows ${{ matrix.pylon_sdk }}
        uses: actions/upload-artifact@v6
        with:
          name: Windows_Pylon_SDK_${{ matrix.pylon_sdk }}
          path: conan

  download_macos:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        pylon_sdk: ${{ fromJson(needs.setup.outputs.macos_pylon_sdks) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install conan v1
        run: pip install "conan<2"

      - name: Add conan v1 remote and authenticate
        env:
          JF_URL: ${{ secrets.SDK_URL }}
          JF_USER: ${{ secrets.SDK_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          import os
          import subprocess

          subprocess.run(["conan", "config", "set", "general.revisions_enabled=1"], check=True)
          subprocess.run([
            "conan", "remote", "add", "pylon-conan-prod",
            f"{os.environ['JF_URL']}/artifactory/api/conan/pylon-conan-prod", "--insert", "0"
          ], check=True)
          subprocess.run([
            "conan", "user", "-p", os.environ["JF_ACCESS_TOKEN"],
            "-r", "pylon-conan-prod", os.environ["JF_USER"]
          ], check=True)
        shell: python

      - name: Download macOS control artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: macOS*Pylon
          merge-multiple: true
          path: pylon-install-files

      - name: Download needed pylon modules
        run: |
          import os
          import subprocess

          arch = "arm64" if os.uname().machine == "arm64" else "x64"
          profile = f"macos_{arch}"

          subprocess.run([
            "conan", "install", "--update", "--install-folder", "conan",
            "-pr", os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "profiles", profile),
            "-o", f"gst-plugin-pylon:control_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'report_macos.json')}",
            "-o", f"gst-plugin-pylon:third_party_license_file={os.path.join(os.environ['GITHUB_WORKSPACE'], 'pylon-install-files', 'pylon_Third-Party_Licenses.txt')}",
            "-c", "tools.system.package_manager:mode=install",
            "-c", "tools.system.package_manager:sudo=True",
            os.path.join(os.environ['GITHUB_WORKSPACE'], ".github", "workflows", "conanfile.py")
          ], check=True)
        shell: python

      - name: Tar pylon SDK files
        run: tar -czf pylon_sdk.tar.gz -C conan pylon

      - name: Upload pylon SDK for macOS ${{ matrix.pylon_sdk }}
        uses: actions/upload-artifact@v6
        with:
          name: macOS_Pylon_SDK_${{ matrix.pylon_sdk }}
          path: pylon_sdk.tar.gz

  build_windows_x86_64:
    needs: [setup, download_windows]
    strategy:
      matrix:
        os: ${{  fromJson(needs.setup.outputs.windows_targets ) }}
        pylon_sdk: ${{  fromJson(needs.setup.outputs.windows_pylon_sdks ) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Build gstreamer for ${{ matrix.pylon_sdk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Download pylon SDK
        uses: actions/download-artifact@v7
        with:
          pattern: Windows_Pylon_SDK_${{ matrix.pylon_sdk }}
          merge-multiple: true
          path: pylon-sdk
      - name: Set pylon root
        id: set_pylon_root
        run: |
          $pylonRoot = (Resolve-Path "pylon-sdk\pylon").Path
          echo "PYLON_ROOT=$pylonRoot" >> $env:GITHUB_ENV
          echo "pylon_root=$pylonRoot" >> $env:GITHUB_OUTPUT

      - name: install meson
        run: |
          pip install meson ninja

      - name: Download Gstreamer
        uses: suisei-cn/actions-download-file@v1
        with:
          url:    https://gstreamer.freedesktop.org/data/pkg/windows/1.26.9/msvc/gstreamer-1.0-msvc-x86_64-1.26.9.msi
          target: ${{ runner.temp }}\

      - name: Download Gstreamer dev
        uses: suisei-cn/actions-download-file@v1
        with:
          url:    https://gstreamer.freedesktop.org/data/pkg/windows/1.26.9/msvc/gstreamer-1.0-devel-msvc-x86_64-1.26.9.msi
          target: ${{ runner.temp }}\

      - name: Install Gstreamer
        run:  |
            cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-1.26.9.msi TARGETDIR="C:\" /quiet ADDLOCAL=ALL /L*V gst.log
            cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-devel-msvc-x86_64-1.26.9.msi TARGETDIR="C:\" /quiet ADDLOCAL=ALL /L*V dev.log
            cat gst.log
            cat dev.log

      - name: Resolve GStreamer root
        id: gstreamer_root
        shell: pwsh
        run: |
          $gstRoot = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $gstRoot) {
            $gstRoot = 'C:\Program Files\gstreamer\1.0\msvc_x86_64'
          }
          $gstRoot = $gstRoot.TrimEnd('\')
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "gstreamer_root=$gstRoot" >> $env:GITHUB_OUTPUT

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: compile
        env:
          PYLON_ROOT: ${{ steps.set_pylon_root.outputs.pylon_root }}
          PYLON_CAMEMU: "3"
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64.TrimEnd('\')
          $env:Path = "$gstRoot\bin;$env:Path"
          $pylonRoot = $env:PYLON_ROOT
          if (Test-Path "$pylonRoot\Development\CMake\pylon") {
            $env:CMAKE_PREFIX_PATH = "$pylonRoot\Development\CMake\pylon\"
          }
          if (Test-Path "$pylonRoot\Runtime\x64") {
            $env:Path = "$pylonRoot\Runtime\x64\;$env:Path"
          }
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PKG_CONFIG = "$gstRoot\bin\pkg-config.exe"

          meson setup build --prefix="$gstRoot"
          ninja -C build
          ninja -C build test
          ninja -C build install

      - name: Print meson log
        if: ${{ failure() }}
        run: |
          cat  build/meson-logs/meson-log.txt

      - name: test
        env:
          PYLON_ROOT: ${{ steps.set_pylon_root.outputs.pylon_root }}
        run: |
          $env:PYLON_CAMEMU="1"
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64.TrimEnd('\')
          $pylonRoot = $env:PYLON_ROOT
          $env:Path = "$gstRoot\bin;$env:Path"
          if (Test-Path "$pylonRoot\Runtime\x64") {
            $env:Path = "$pylonRoot\Runtime\x64\;$env:Path"
          }
          gst-inspect-1.0.exe pylonsrc
          gst-launch-1.0.exe pylonsrc num-buffers=10 ! fakesink

  build_linux_aarch64:
    needs: [setup, download_linux_aarch64]
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.linux_aarch64_targets) }}
        pylon_sdk: ${{ fromJson(needs.setup.outputs.linux_aarch64_pylon_sdks) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Build pylon ${{ matrix.pylon_sdk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Download pylon SDK
        uses: actions/download-artifact@v7
        with:
          pattern: Linux_aarch64_Pylon_SDK_${{ matrix.pylon_sdk }}
          merge-multiple: true
          path: pylon-sdk

      - name: Unpack pylon SDK to pylon-sdk folder
        run: |
          tar -xzf pylon-sdk/pylon_sdk.tar.gz -C pylon-sdk
          PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          echo "PYLON_ROOT=$PYLON_ROOT" >> $GITHUB_ENV
          sudo mkdir -p /opt
          sudo ln -sfn "$PYLON_ROOT" /opt/pylon
          echo "PYLON_ROOT contents:" && ls -la "$PYLON_ROOT" || true
          find "$PYLON_ROOT" -name '*Config*.cmake' | head -20 || true
          sudo apt-get install -y "$PYLON_ROOT"/share/pylon/codemeter_*.deb --fix-broken || echo "Codemeter install failed"

      - name: install required environment
        run: |
          sudo apt-get update
          sudo dpkg-query -W -f='${Status}' libunwind-14-dev  | grep "ok installed" && sudo apt-get remove -y libunwind-14-dev
          # python3-gi: camemu restart_resource_cleanup / appsink / pygstpylon tests
          # python3-dev: pygstpylon CPython limited-API module
          sudo apt-get -y install python3 python3-pip python3-dev python3-gi gir1.2-gstreamer-1.0 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev cmake clang \
            gstreamer1.0-tools gstreamer1.0-plugins-base python3-venv
          python3 -m venv build_python --system-site-packages
          . build_python/bin/activate
          pip install pip --upgrade
          pip install meson ninja

      - name: compile gcc
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export LD_LIBRARY_PATH="$PYLON_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CC=gcc
          export CXX=g++
          export PYLON_CAMEMU=3
          . build_python/bin/activate
          meson setup builddir_gcc --prefix $PWD/install_gcc -Dpython-bindings=enabled
          ninja -C builddir_gcc
          meson test -C builddir_gcc --print-errorlogs
          ninja -C builddir_gcc install

      - name: compile clang
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export LD_LIBRARY_PATH="$PYLON_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CC=clang
          export CXX=clang++
          export PYLON_CAMEMU=3
          . build_python/bin/activate
          meson setup builddir_clang --prefix $PWD/install_clang -Dpython-bindings=enabled
          ninja -C builddir_clang
          meson test -C builddir_clang --print-errorlogs
          ninja -C builddir_clang install

      - name: run tests gcc
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export GST_PLUGIN_PATH=$PWD/install_gcc/lib/aarch64-linux-gnu/gstreamer-1.0
          export LD_LIBRARY_PATH=$PWD/install_gcc/lib/aarch64-linux-gnu:$PYLON_ROOT/lib
          export PYLON_CAMEMU=1
          gst-inspect-1.0 pylonsrc
          gst-launch-1.0 pylonsrc num-buffers=10 ! fakesink

      - name: run tests clang
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export GST_PLUGIN_PATH=$PWD/install_clang/lib/aarch64-linux-gnu/gstreamer-1.0
          export LD_LIBRARY_PATH=$PWD/install_clang/lib/aarch64-linux-gnu:$PYLON_ROOT/lib
          export PYLON_CAMEMU=1
          gst-inspect-1.0 pylonsrc
          gst-launch-1.0 pylonsrc num-buffers=10 ! fakesink

  build_linux_x86_64:
    needs: [setup, download_linux_x86_64]
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.linux_x86_64_targets) }}
        pylon_sdk: ${{ fromJson(needs.setup.outputs.linux_x86_64_pylon_sdks) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Build pylon ${{ matrix.pylon_sdk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Download pylon SDK
        uses: actions/download-artifact@v7
        with:
          pattern: Linux_x86_64_Pylon_SDK_${{ matrix.pylon_sdk }}
          merge-multiple: true
          path: pylon-sdk

      - name: Unpack pylon SDK to pylon-sdk folder
        run: |
          tar -xzf pylon-sdk/pylon_sdk.tar.gz -C pylon-sdk
          PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          echo "PYLON_ROOT=$PYLON_ROOT" >> $GITHUB_ENV
          sudo mkdir -p /opt
          sudo ln -sfn "$PYLON_ROOT" /opt/pylon
          echo "PYLON_ROOT contents:" && ls -la "$PYLON_ROOT" || true
          find "$PYLON_ROOT" -name '*Config*.cmake' | head -20 || true
          sudo apt-get install -y "$PYLON_ROOT"/share/pylon/codemeter_*.deb --fix-broken || echo "Codemeter install failed"

      - name: install required environment
        run: |
          sudo apt-get update
          sudo dpkg-query -W -f='${Status}' libunwind-14-dev  | grep "ok installed" && sudo apt-get remove -y libunwind-14-dev
          # python3-gi: camemu restart_resource_cleanup / appsink / pygstpylon tests
          # python3-dev: pygstpylon CPython limited-API module
          sudo apt-get -y install python3 python3-pip python3-dev python3-gi gir1.2-gstreamer-1.0 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev cmake clang \
            gstreamer1.0-tools gstreamer1.0-plugins-base python3-venv
          python3 -m venv build_python --system-site-packages
          . build_python/bin/activate
          pip install pip --upgrade
          pip install meson ninja

      - name: compile gcc
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export LD_LIBRARY_PATH="$PYLON_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CC=gcc
          export CXX=g++
          export PYLON_CAMEMU=3
          . build_python/bin/activate
          meson setup builddir_gcc --prefix $PWD/install_gcc -Dpython-bindings=enabled
          ninja -C builddir_gcc
          meson test -C builddir_gcc --print-errorlogs
          ninja -C builddir_gcc install

      - name: compile clang
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export LD_LIBRARY_PATH="$PYLON_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CC=clang
          export CXX=clang++
          export PYLON_CAMEMU=3
          . build_python/bin/activate
          meson setup builddir_clang --prefix $PWD/install_clang -Dpython-bindings=enabled
          ninja -C builddir_clang
          meson test -C builddir_clang --print-errorlogs
          ninja -C builddir_clang install

      - name: run tests gcc
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export GST_PLUGIN_PATH=$PWD/install_gcc/lib/x86_64-linux-gnu/gstreamer-1.0
          export LD_LIBRARY_PATH=$PWD/install_gcc/lib/x86_64-linux-gnu/:$PYLON_ROOT/lib
          export PYLON_CAMEMU=1
          gst-inspect-1.0 pylonsrc
          gst-launch-1.0 pylonsrc num-buffers=10 ! fakesink

      - name: run tests clang
        run: |
          export PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          export GST_PLUGIN_PATH=$PWD/install_clang/lib/x86_64-linux-gnu/gstreamer-1.0
          export LD_LIBRARY_PATH=$PWD/install_clang/lib/x86_64-linux-gnu/:$PYLON_ROOT/lib
          export PYLON_CAMEMU=1
          gst-inspect-1.0 pylonsrc
          gst-launch-1.0 pylonsrc num-buffers=10 ! fakesink

  build_macos:
    needs: [setup, download_macos]
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.macos_targets) }}
        pylon_sdk: ${{ fromJson(needs.setup.outputs.macos_pylon_sdks) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    name: Build pylon ${{ matrix.pylon_sdk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Download pylon SDK
        uses: actions/download-artifact@v7
        with:
          pattern: macOS_Pylon_SDK_${{ matrix.pylon_sdk }}
          merge-multiple: true
          path: pylon-sdk

      - name: Unpack pylon SDK
        run: |
          tar -xzf pylon-sdk/pylon_sdk.tar.gz -C pylon-sdk
          PYLON_ROOT="${{ github.workspace }}/pylon-sdk/pylon"
          echo "PYLON_ROOT=$PYLON_ROOT" >> $GITHUB_ENV
          echo "PYLON_ROOT contents:" && ls -la "$PYLON_ROOT" || true
          find "$PYLON_ROOT" \( -name 'pylon.framework' -o -name '*Config*.cmake' \) | head -40 || true

      - name: Install build tools
        run: brew install meson ninja cmake pkgconf gstreamer

      - name: compile
        env:
          PYLON_CAMEMU: "3"
        run: |
          export PYLON_ROOT="${PYLON_ROOT:-${{ github.workspace }}/pylon-sdk/pylon}"
          for fw in "$PYLON_ROOT/Library/Frameworks" "$PYLON_ROOT/Frameworks"; do
            if [[ -d "$fw" ]]; then
              export DYLD_FRAMEWORK_PATH="$fw${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
            fi
          done
          export CMAKE_PREFIX_PATH="$PYLON_ROOT:$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Resources:$PYLON_ROOT/Frameworks/pylon.framework/Resources:${CMAKE_PREFIX_PATH:-}"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          meson setup builddir --prefix "$PWD/install"
          ninja -C builddir
          meson test -C builddir --print-errorlogs
          ninja -C builddir install

      - name: Print meson log
        if: ${{ failure() }}
        run: cat builddir/meson-logs/meson-log.txt

      - name: smoke test
        run: |
          export PYLON_ROOT="${PYLON_ROOT:-${{ github.workspace }}/pylon-sdk/pylon}"
          for fw in "$PYLON_ROOT/Library/Frameworks" "$PYLON_ROOT/Frameworks"; do
            if [[ -d "$fw" ]]; then
              export DYLD_FRAMEWORK_PATH="$fw${DYLD_FRAMEWORK_PATH:+:$DYLD_FRAMEWORK_PATH}"
            fi
          done
          PLUGIN_SO="$(find "$PWD/install" -name 'libgstpylon.dylib' -o -name 'libgstpylon.so' | head -1)"
          PLUGIN_DIR="$(dirname "$PLUGIN_SO")"
          GSTLIB_DIR="$(dirname "$(find "$PWD/install" -name 'libgstpylon-1.0.dylib' | head -1)")"
          export GST_PLUGIN_PATH="$PLUGIN_DIR"
          export DYLD_LIBRARY_PATH="${GSTLIB_DIR}:${DYLD_LIBRARY_PATH:-}"
          export PYLON_CAMEMU=1
          export PATH="$(brew --prefix gstreamer)/bin:$PATH"
          gst-inspect-1.0 pylonsrc
          gst-launch-1.0 pylonsrc num-buffers=10 ! fakesink

  cleanup:
    if: always()
    needs: [
            setup,
            download_linux_x86_64,
            download_linux_aarch64,
            download_windows,
            download_macos,
            build_linux_x86_64,
            build_linux_aarch64,
            build_windows_x86_64,
            build_macos
    ]
    runs-on: ubuntu-latest
    steps:
    - uses: geekyeggo/delete-artifact@v6
      continue-on-error: true
      with:
        name: |
          Linux_x86_64_Pylon
          Linux_x86_64_Pylon_SDK_*
          Linux_aarch64_Pylon
          Linux_aarch64_Pylon_SDK_*
          Windows_Pylon
          Windows_Pylon_SDK_*
          macOS_Pylon
          macOS_Pylon_SDK_*
